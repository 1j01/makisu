<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Sushi Simulator - Taichi.js edition</title>

	<style type="text/css">
		#game-frame>div {
			font-size: 44px;
			font-family: monospace;
			font-weight: bold;
		}

		.game {
			width: 100vw;
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.game canvas {
			max-width: 100vh;
			max-height: 100vw;
			aspect-ratio: 1;
		}
	</style>
</head>

<body style="margin:0; padding:0;">
	<div class="game" style="margin: 0; position: relative; background: #1a1c2c;">
		<canvas style="width: 100%; height: 100%; margin: 0 auto; display: block; image-rendering: pixelated;"
			id="result_canvas" oncontextmenu="event.preventDefault()" onmousedown="window.focus()"></canvas>
	</div>

	<div id="info"
		style="position: absolute; bottom: 0; right: 0; background: rgba(0, 0, 0, 0.7); color: white; padding: 5px 10px; border-top-left-radius: 10px; font-family: sans-serif;">
		<a href=".." style="color: white; text-decoration: none;">Play 3D version</a>
		&nbsp;&middot;&nbsp;
		<a href="https://github.com/1j01/makisu?tab=readme-ov-file#readme"
			style="color: white; text-decoration: none;">GitHub</a>
	</div>

	<script src="../libs/taichi.js-v0.0.36.umd.js"></script>
	<script src="sim.js"></script>
</body>

</html>
